name: Release

# Every push to main and every manual dispatch publishes one uniquely tagged,
# non-draft Windows release. This workflow deliberately runs no tests, lint,
# type checks, static analysis, accessibility checks, or screenshot checks.
# Local verification happens before push; this workflow only bootstraps,
# builds, packages, publishes, and reads the published release back.
#
# Publication is a non-idempotent side effect, so cancel-in-progress is not
# used: cancellation can strand a tag or draft between asset uploads.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build, package, and publish (Windows)
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Record workflow start fallback
        id: timing_fallback
        shell: pwsh
        run: |
          "start_iso=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_OUTPUT

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive a unique monotonic release tag
        id: tag
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $baseVersion = [string]$package.version
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release package version must be a stable three-part semantic version; received $baseVersion."
          }
          $runNumber = [int64]$env:GITHUB_RUN_NUMBER
          if ($runNumber -lt 1 -or $runNumber -gt [int]::MaxValue) {
            throw 'GITHUB_RUN_NUMBER must be a positive 32-bit integer.'
          }
          $parts = $baseVersion.Split('.')
          if ([int64]$parts[2] -ne 0) {
            throw 'The committed base patch must stay 0 because GITHUB_RUN_NUMBER owns the monotonic patch component.'
          }
          $version = "$($parts[0]).$($parts[1]).$runNumber"
          $tag = "v$version"
          "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Inspect this workflow run's release state
        id: release_state
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $runMarker = '/actions/runs/${{ github.run_id }}'
          $pages = gh api 'repos/${{ github.repository }}/releases?per_page=100' --paginate --slurp | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases for workflow-run recovery.' }
          $existing = @($pages | ForEach-Object { $_ } | Where-Object { [string]$_.tag_name -eq $tag })
          if ($existing.Count -gt 1) { throw "More than one release already uses $tag." }
          if ($existing.Count -eq 0) {
            "state=none" >> $env:GITHUB_OUTPUT
            return
          }
          $release = $existing[0]
          if ([string]$release.target_commitish -ne '${{ github.sha }}' -or
              -not ([string]$release.body).Contains($runMarker)) {
            throw "Existing release $tag is not owned by this workflow run and exact commit."
          }
          "state=$(if ([bool]$release.draft) { 'draft' } else { 'published' })" >> $env:GITHUB_OUTPUT
          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT
          "published_at=$($release.published_at)" >> $env:GITHUB_OUTPUT
          "release_url=$($release.html_url)" >> $env:GITHUB_OUTPUT

      - name: Build runnable application through canonical script
        if: steps.release_state.outputs.state != 'published'
        shell: cmd
        run: call build.bat /s

      - name: Build and verify unsigned installer through canonical script
        if: steps.release_state.outputs.state != 'published'
        shell: cmd
        env:
          RELEASE_BUILD_VERSION: ${{ steps.tag.outputs.version }}
        run: call build-installer.bat /s

      - name: Generate committed line-count report
        if: steps.release_state.outputs.state != 'published'
        shell: cmd
        run: |
          call download-dependencies.bat /s
          node tools\line-count\count.mjs > release\evidence\lines.md

      - name: Resolve unused published dim-sum code name
        id: dim_sum
        if: steps.release_state.outputs.state != 'published'
        shell: pwsh
        run: |
          $gate = Get-Content release-gate.json -Raw | ConvertFrom-Json
          $metadata = Join-Path $env:RUNNER_TEMP 'meadowmark-release-metadata'
          New-Item -ItemType Directory -Path $metadata -Force | Out-Null
          $catalog = Join-Path $metadata 'catalog.json'
          $catalogReleases = Join-Path $metadata 'catalog-releases.json'
          $projectReleases = Join-Path $metadata 'project-releases.json'
          $selection = Join-Path $metadata 'dim-sum-selection.json'
          "catalog_url=$($gate.dimSum.catalogUrl)" >> $env:GITHUB_OUTPUT
          try {
            Invoke-WebRequest -UseBasicParsing -Uri $gate.dimSum.catalogUrl -OutFile $catalog
            gh api "repos/$($gate.dimSum.repository)/releases?per_page=100" --paginate --slurp | Out-File $catalogReleases -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'The public catalog release inventory was unavailable.' }
            gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --slurp | Out-File $projectReleases -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'The project release inventory was unavailable.' }
            node tools/release/select-dim-sum.mjs `
              --catalog $catalog `
              --catalog-releases $catalogReleases `
              --project-releases $projectReleases `
              --output $selection
            if ($LASTEXITCODE -ne 0) { throw 'The public dim-sum catalog could not be resolved.' }
            $selected = Get-Content $selection -Raw | ConvertFrom-Json
            if ([bool]$selected.available) {
              "available=true" >> $env:GITHUB_OUTPUT
              "code_name=$($selected.codeName)" >> $env:GITHUB_OUTPUT
              "dish_id=$($selected.dishId)" >> $env:GITHUB_OUTPUT
              "asset_name=$($selected.assetName)" >> $env:GITHUB_OUTPUT
              "photo_url=$($selected.photoUrl)" >> $env:GITHUB_OUTPUT
              "catalog_release_url=$($selected.catalogReleaseUrl)" >> $env:GITHUB_OUTPUT
              "catalog_release_tag=$($selected.catalogReleaseTag)" >> $env:GITHUB_OUTPUT
              "verification_token=$($selected.codeName)" >> $env:GITHUB_OUTPUT
            } else {
              "available=false" >> $env:GITHUB_OUTPUT
              "omission_reason=No unused dish with a verified published photo was available." >> $env:GITHUB_OUTPUT
              "verification_token=No dim-sum code name was resolved" >> $env:GITHUB_OUTPUT
              Write-Warning 'Shipping with the version alone because no unused published dish was available.'
            }
          } catch {
            "available=false" >> $env:GITHUB_OUTPUT
            "omission_reason=The public dim-sum catalog could not be verified during publication." >> $env:GITHUB_OUTPUT
            "verification_token=No dim-sum code name was resolved" >> $env:GITHUB_OUTPUT
            Write-Warning 'Shipping with the version alone because the public dim-sum catalog was unavailable.'
          }

      - name: Write preliminary factual release notes
        id: notes
        if: steps.release_state.outputs.state != 'published'
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $evidence = Get-Content release/evidence/release-evidence.json -Raw | ConvertFrom-Json
          if ($evidence.commit -ne '${{ github.sha }}') {
            throw "Artifact commit $($evidence.commit) does not match workflow commit ${{ github.sha }}."
          }
          $lines = Get-Content release/evidence/lines.md -Raw
          $hashes = Get-Content release/evidence/SHA256SUMS.txt -Raw
          $notesPath = Join-Path $env:RUNNER_TEMP 'meadowmark-release-notes.md'
          if ('${{ steps.dim_sum.outputs.available }}' -eq 'true') {
            $dimSum = @"
          **${{ steps.dim_sum.outputs.code_name }}** (`${{ steps.dim_sum.outputs.dish_id }}`)

          - [Published dish photo (${{ steps.dim_sum.outputs.asset_name }})](${{ steps.dim_sum.outputs.photo_url }})
          - [Catalog release ${{ steps.dim_sum.outputs.catalog_release_tag }}](${{ steps.dim_sum.outputs.catalog_release_url }})
          - [Public catalog index](${{ steps.dim_sum.outputs.catalog_url }})

          The photo is linked from the public catalog. It is not copied into
          this repository or attached to this release.
          "@
          } else {
            $dimSum = @"
          No dim-sum code name was resolved. ${{ steps.dim_sum.outputs.omission_reason }}

          The release is shipping with its version alone, as required when the
          public catalog is unavailable or its eligible names are exhausted.
          [Public catalog index](${{ steps.dim_sum.outputs.catalog_url }})
          "@
          }
          @"
          ## Meadowmark $tag

          Exact commit: `${{ github.sha }}`
          Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This release contains an unsigned Windows installer built through the
          committed `build-installer.bat /s` Squirrel.Windows path. Code signing
          is permanently disabled. Windows may show an unknown-publisher or
          SmartScreen warning. Meadowmark is free and has no purchases.

          GitHub Actions ran no tests and no lint. That is the project's
          deliberate delivery policy; local checks are reported separately.

          ### Dim-sum code name

          $dimSum

          ### Artifact SHA-256

          ```text
          $hashes
          ```

          ### Workflow timing

          Timing is finalized from the first job's recorded start through the
          release publication timestamp after the draft is published.

          ### Line count

          $lines
          "@ | Out-File -FilePath $notesPath -Encoding utf8
          "path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create or replace the owned draft release
        id: prepare_release
        if: steps.release_state.outputs.state != 'published'
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $assets = @(Get-ChildItem release/publish -File | Sort-Object Name)
          if ($assets.Count -ne 3) {
            throw "Expected exactly three verified publish assets; found $($assets.Count)."
          }
          if ('${{ steps.release_state.outputs.state }}' -eq 'draft') {
            gh api --method DELETE 'repos/${{ github.repository }}/releases/${{ steps.release_state.outputs.release_id }}'
            if ($LASTEXITCODE -ne 0) { throw "Could not replace the owned incomplete draft release $tag." }
          }
          gh release create $tag `
            @($assets.FullName) `
            --draft `
            --title "Meadowmark $tag" `
            --notes-file '${{ steps.notes.outputs.path }}' `
            --target '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw "Could not create the draft release $tag." }

      - name: Publish the release exactly once
        id: publish
        if: steps.release_state.outputs.state != 'published'
        shell: pwsh
        run: |
          gh release edit '${{ steps.tag.outputs.tag }}' --draft=false
          $published = gh api 'repos/${{ github.repository }}/releases/tags/${{ steps.tag.outputs.tag }}' | ConvertFrom-Json
          if (-not $published.published_at -or [bool]$published.draft) {
            throw 'Release did not become a published non-draft release.'
          }
          "published_at=$($published.published_at)" >> $env:GITHUB_OUTPUT
          "release_url=$($published.html_url)" >> $env:GITHUB_OUTPUT

      - name: Finalize release notes with publication timing
        id: timing
        if: steps.release_state.outputs.state != 'published'
        shell: pwsh
        run: |
          $jobs = gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=all&per_page=100' | ConvertFrom-Json
          $firstJob = $jobs.jobs | Where-Object { $_.started_at } | Sort-Object started_at | Select-Object -First 1
          $startIso = if ($firstJob) { [string]$firstJob.started_at } else { '${{ steps.timing_fallback.outputs.start_iso }}' }
          $endIso = '${{ steps.publish.outputs.published_at }}'
          $start = [DateTimeOffset]::Parse($startIso).ToUniversalTime()
          $end = [DateTimeOffset]::Parse($endIso).ToUniversalTime()
          $duration = $end - $start
          if ($duration.TotalSeconds -lt 0) { throw 'Workflow publication duration is negative.' }
          $durationText = '{0:D2}:{1:D2}:{2:D2}' -f [int]$duration.TotalHours, $duration.Minutes, $duration.Seconds
          $notes = Get-Content '${{ steps.notes.outputs.path }}' -Raw
          $timing = @"
          ### Workflow timing

          - Workflow started: $($start.ToString('o'))
          - Workflow completed: $($end.ToString('o'))
          - Workflow duration: $durationText
          "@
          $notes = $notes -replace '(?s)### Workflow timing.*?### Line count', "$timing`r`n`r`n### Line count"
          $notes | Out-File '${{ steps.notes.outputs.path }}' -Encoding utf8
          gh release edit '${{ steps.tag.outputs.tag }}' --notes-file '${{ steps.notes.outputs.path }}'
          "start_iso=$($start.ToString('o'))" >> $env:GITHUB_OUTPUT
          "end_iso=$($end.ToString('o'))" >> $env:GITHUB_OUTPUT
          "duration=$durationText" >> $env:GITHUB_OUTPUT

      - name: Recover timing without changing published release identity
        if: steps.release_state.outputs.state == 'published'
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          if ([string]$release.body -match 'Workflow duration: \d{2}:\d{2}:\d{2}') {
            Write-Host 'Published release timing is already finalized.'
            return
          }
          $jobs = gh api 'repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?filter=all&per_page=100' | ConvertFrom-Json
          $firstJob = $jobs.jobs | Where-Object { $_.started_at } | Sort-Object started_at | Select-Object -First 1
          if (-not $firstJob -or -not $release.published_at) { throw 'Could not recover exact workflow timing.' }
          $start = [DateTimeOffset]::Parse([string]$firstJob.started_at).ToUniversalTime()
          $end = [DateTimeOffset]::Parse([string]$release.published_at).ToUniversalTime()
          $duration = $end - $start
          if ($duration.TotalSeconds -lt 0) { throw 'Recovered workflow publication duration is negative.' }
          $durationText = '{0:D2}:{1:D2}:{2:D2}' -f [int]$duration.TotalHours, $duration.Minutes, $duration.Seconds
          $timing = @"
          ### Workflow timing

          - Workflow started: $($start.ToString('o'))
          - Workflow completed: $($end.ToString('o'))
          - Workflow duration: $durationText
          "@
          $notes = [string]$release.body
          $notes = $notes -replace '(?s)### Workflow timing.*?### Line count', "$timing`r`n`r`n### Line count"
          if ($notes -eq [string]$release.body) { throw 'Could not locate the preliminary workflow-timing section.' }
          $notesPath = Join-Path $env:RUNNER_TEMP 'meadowmark-recovered-release-notes.md'
          $notes | Out-File $notesPath -Encoding utf8
          gh release edit $tag --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not finalize timing on the owned published release.' }

      - name: Read published release and assets back
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          if ($release.tag_name -ne $tag -or [bool]$release.draft -or [bool]$release.prerelease) {
            throw 'Published release state does not match the intended tag/non-draft/non-prerelease contract.'
          }
          if ($release.target_commitish -ne '${{ github.sha }}') {
            throw "Release target $($release.target_commitish) does not match ${{ github.sha }}."
          }
          if ('${{ steps.release_state.outputs.state }}' -eq 'published') {
            $hashMatches = [regex]::Matches([string]$release.body, '(?m)^([0-9a-f]{64})  ([^\r\n]+)$')
            $expectedArtifacts = @($hashMatches | ForEach-Object {
              [pscustomobject]@{ sha256 = $_.Groups[1].Value; name = $_.Groups[2].Value }
            })
            if ($expectedArtifacts.Count -ne 3) { throw 'Published release notes do not contain exactly three artifact hashes.' }
          } else {
            $expected = Get-Content release/evidence/release-evidence.json -Raw | ConvertFrom-Json
            $expectedArtifacts = @($expected.artifacts)
          }
          $expectedNames = @($expectedArtifacts | ForEach-Object { $_.name } | Sort-Object)
          $actualNames = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if (($expectedNames -join "`n") -ne ($actualNames -join "`n")) {
            throw "Published asset names differ from verified artifact names. Expected: $expectedNames; actual: $actualNames"
          }
          foreach ($asset in $release.assets) {
            if ([int64]$asset.size -le 0) { throw "Published asset $($asset.name) is empty." }
          }
          $requiredText = @('${{ github.sha }}', '/actions/runs/${{ github.run_id }}')
          if ('${{ steps.release_state.outputs.state }}' -ne 'published') {
            $requiredText += @('${{ steps.dim_sum.outputs.verification_token }}', '${{ steps.timing.outputs.duration }}')
          }
          foreach ($required in $requiredText) {
            if (-not ([string]$release.body).Contains($required)) {
              throw "Published release notes are missing required evidence: $required"
            }
          }
          if ([string]$release.body -notmatch 'Workflow duration: \d{2}:\d{2}:\d{2}') {
            throw 'Published release notes are missing stable workflow-duration evidence.'
          }
          $download = Join-Path $env:RUNNER_TEMP 'meadowmark-release-readback'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          gh release download $tag --dir $download
          foreach ($artifact in $expectedArtifacts) {
            $path = Join-Path $download $artifact.name
            if (-not (Test-Path -LiteralPath $path)) { throw "Read-back download is missing $($artifact.name)." }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $artifact.sha256) { throw "Read-back SHA-256 mismatch for $($artifact.name)." }
          }
          Write-Host "Verified published release: $($release.html_url)"

      - name: Collect safe build and failure evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'meadowmark-ci-evidence'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          [ordered]@{
            runId = '${{ github.run_id }}'
            runAttempt = '${{ github.run_attempt }}'
            commit = '${{ github.sha }}'
            jobStatus = '${{ job.status }}'
            runnerOS = '${{ runner.os }}'
            runnerArch = '${{ runner.arch }}'
          } | ConvertTo-Json | Out-File (Join-Path $destination 'workflow-context.json') -Encoding utf8
          if (Test-Path release/evidence) { Copy-Item release/evidence (Join-Path $destination 'release-evidence') -Recurse -Force }
          if (Test-Path release/publish) { Copy-Item release/publish (Join-Path $destination 'publish') -Recurse -Force }
          $notesPath = '${{ steps.notes.outputs.path }}'
          if (-not [string]::IsNullOrWhiteSpace($notesPath) -and (Test-Path -LiteralPath $notesPath)) {
            Copy-Item -LiteralPath $notesPath -Destination (Join-Path $destination 'release-notes.md') -Force
          }

      - name: Upload safe build and failure evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/meadowmark-ci-evidence
          if-no-files-found: warn
          retention-days: 7
