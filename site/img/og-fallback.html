<!-- Meadowmark — HTML/CSS-drawn fallback for the Open Graph social-preview
     image. The actual og:image tag on every page points at the bundled
     og-image.svg (an absolute https:// URL, per the requirement that a
     relative path is the commonest reason an embed shows no picture).
     This fallback exists so the same design has a second, dependency-free
     rendering path that needs no image decoder at all — useful for a
     print preview, a very old crawler, or manual visual review — and it
     is drawn entirely with inline CSS, no external assets. -->
<div style="width:1200px;height:630px;position:relative;overflow:hidden;font-family:Georgia,'Segoe UI',serif;background:linear-gradient(#cdeccb,#f7fbf1);">
  <div style="position:absolute;left:0;right:0;bottom:0;height:160px;background:#3a6b3f;"></div>
  <div style="position:absolute;left:0;right:0;bottom:150px;height:40px;background:#4d8a53;"></div>
  <div style="position:absolute;left:80px;bottom:160px;width:120px;height:90px;background:#8a6d1f;clip-path:polygon(0 100%,0 30%,50% 0,100% 30%,100% 100%);"></div>
  <div style="position:absolute;left:260px;bottom:160px;width:90px;height:70px;background:#3d6373;"></div>
  <div style="position:absolute;left:400px;bottom:160px;width:70px;height:50px;background:#8a6d1f;"></div>
  <div style="position:absolute;right:150px;bottom:160px;width:100px;height:60px;background:#3a6b3f;"></div>
  <div style="position:absolute;right:60px;bottom:160px;width:60px;height:40px;background:#8a6d1f;"></div>
  <h1 style="position:absolute;top:130px;left:0;right:0;text-align:center;font-size:88px;font-weight:700;color:#191d17;margin:0;">Meadowmark</h1>
  <p style="position:absolute;top:250px;left:0;right:0;text-align:center;font-size:30px;color:#3a6b3f;font-family:'Segoe UI',sans-serif;margin:0;">A 3D town-and-farm building game for Windows</p>
  <p style="position:absolute;top:295px;left:0;right:0;text-align:center;font-size:24px;color:#42493f;font-family:'Segoe UI',sans-serif;margin:0;">Nothing here is ever for sale</p>
</div>
