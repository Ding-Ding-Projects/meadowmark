# electron-builder configuration for Meadowmark.
#
# Windows only, Squirrel.Windows only. Meadowmark is free with no
# purchases of any kind, so there is nothing to gate behind a signed
# release channel -- but more importantly: CODE SIGNING IS PERMANENTLY
# PROHIBITED FOR THIS PROJECT. Never request, generate, store, or invoke a
# code-signing certificate or signer here. The three signing-related
# fields below are set to `false` explicitly, on purpose, forever -- do
# not "fix" this by re-enabling them, and do not silently discover a
# certificate and wire it in. An unsigned Setup.exe will trigger Windows'
# unknown-publisher / SmartScreen warning; that is expected and the
# README says so.

appId: com.dingdingprojects.meadowmark
productName: Meadowmark
copyright: Copyright (c) Ding-Ding Projects

directories:
  output: release
  buildResources: build-resources

files:
  - packages/app/dist/**/*
  - packages/ui/dist/**/*
  - package.json
  - "!**/*.ts"
  - "!**/*.map"

extraMetadata:
  main: packages/app/dist/main.cjs
  # NOT `build:`. electron-builder treats a `build` key here as the deprecated
  # --em.build CLI form and refuses to package at all, with the singularly
  # unhelpful message "--em.build is deprecated, please specify as -c". `build` is
  # its own reserved package.json config key, so the stamped commit lives under a
  # name it does not own.
  releaseCommit: "${env.RELEASE_COMMIT_SHA}"

# Permanent no-signing policy. See the module comment above.
# Only `forceCodeSigning` is a valid top-level property. `signExecutable` is
# not an electron-builder option at all, and `signAndEditExecutable` belongs
# under `win` -- both were rejected by the 26.x schema validator, which is
# what this comment block previously claimed to be protecting against.
forceCodeSigning: false

win:
  # Do not re-enable. See the no-signing policy above.
  # Keep resource editing available while explicitly disabling every Windows
  # executable signing path. This is separate from signAndEditExecutable:
  # electron-builder's schema documents both switches and signExecutable also
  # covers installer/auxiliary artifacts that use the standard signing path.
  signExecutable: false
  # signAndEditExecutable is deliberately NOT set to false here. Setting it
  # disables electron-builder's PE resource editor as well as signing, so no
  # icon is ever embedded and the release verifier blocks forever on a missing
  # large/small icon pair -- which is exactly where this build sat. From
  # electron-builder's own log: "To skip only code signing while keeping icon
  # and metadata applied, use signExecutable: false instead."
  #
  # Code signing remains permanently prohibited and is off via signExecutable
  # above and forceCodeSigning below, with no certificate configured anywhere.
  # The release script independently proves the produced Setup.exe carries no
  # Authenticode certificate, so this stays fail-closed rather than trusted.
  icon: design/icons/meadowmark.ico
  target:
    - target: squirrel
  artifactName: "${productName}-Setup-${version}.${ext}"

squirrelWindows:
  # electron-builder-squirrel-windows 26.x rejects the legacy `setupExe` /
  # `noMsi` keys with a schema-validation error; `artifactName` is the
  # supported way to control the generated setup executable's name.
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Squirrel stores this immutable commit-pinned URL in package/update
  # metadata. build-installer.ps1 supplies RELEASE_COMMIT_SHA from HEAD and
  # refuses a dirty tracked tree, so the URL always identifies the same icon
  # bytes as the package being built rather than mutable main-branch content.
  iconUrl: "https://raw.githubusercontent.com/Ding-Ding-Projects/meadowmark/${env.RELEASE_COMMIT_SHA}/design/icons/meadowmark.ico"
