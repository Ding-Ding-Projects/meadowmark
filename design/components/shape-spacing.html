<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meadowmark — Shape &amp; spacing</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/preview.css">
</head>
<body class="mm-ds-preview">
<div class="mm-ds-toolbar"><strong>Meadowmark · Shape &amp; spacing</strong></div>

<section class="mm-ds-section">
  <h2>Corner scale</h2>
  <div class="mm-ds-grid">
    <div><div style="height:80px;background:var(--mm-primary-container);border-radius:var(--mm-radius-none)"></div><div class="hint">none — 0px</div></div>
    <div><div style="height:80px;background:var(--mm-primary-container);border-radius:var(--mm-radius-xs)"></div><div class="hint">xs — 4px</div></div>
    <div><div style="height:80px;background:var(--mm-primary-container);border-radius:var(--mm-radius-sm)"></div><div class="hint">sm — 8px</div></div>
    <div><div style="height:80px;background:var(--mm-primary-container);border-radius:var(--mm-radius-md)"></div><div class="hint">md — 12px</div></div>
    <div><div style="height:80px;background:var(--mm-primary-container);border-radius:var(--mm-radius-lg)"></div><div class="hint">lg — 16px</div></div>
    <div><div style="height:80px;background:var(--mm-primary-container);border-radius:var(--mm-radius-xl)"></div><div class="hint">xl — 28px</div></div>
    <div><div style="height:80px;background:var(--mm-primary-container);border-radius:var(--mm-radius-full)"></div><div class="hint">full — 999px</div></div>
  </div>
</section>

<section class="mm-ds-section">
  <h2>Spacing scale (4px grid)</h2>
  <div style="display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:8px"><span class="hint" style="width:70px">space-1</span><div style="height:16px;width:var(--mm-space-1);background:var(--mm-secondary)"></div><span class="hint">4px</span></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="hint" style="width:70px">space-2</span><div style="height:16px;width:var(--mm-space-2);background:var(--mm-secondary)"></div><span class="hint">8px</span></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="hint" style="width:70px">space-3</span><div style="height:16px;width:var(--mm-space-3);background:var(--mm-secondary)"></div><span class="hint">12px</span></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="hint" style="width:70px">space-4</span><div style="height:16px;width:var(--mm-space-4);background:var(--mm-secondary)"></div><span class="hint">16px</span></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="hint" style="width:70px">space-5</span><div style="height:16px;width:var(--mm-space-5);background:var(--mm-secondary)"></div><span class="hint">24px</span></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="hint" style="width:70px">space-6</span><div style="height:16px;width:var(--mm-space-6);background:var(--mm-secondary)"></div><span class="hint">32px</span></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="hint" style="width:70px">space-7</span><div style="height:16px;width:var(--mm-space-7);background:var(--mm-secondary)"></div><span class="hint">48px</span></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="hint" style="width:70px">space-8</span><div style="height:16px;width:var(--mm-space-8);background:var(--mm-secondary)"></div><span class="hint">64px</span></div>
  </div>
</section>
</body>
</html>
